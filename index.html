<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>🦜 Kiwi AI</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#212121;
color:white;
}

button{
cursor:pointer;
}

.oculto{
display:none!important;
}


/* LOGIN */

.pantalla{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#171717;
}

.caja{
width:380px;
max-width:90%;
background:#252525;
padding:35px;
border-radius:16px;
text-align:center;
border:1px solid #3b3b3b;
}

.logo{
font-size:60px;
}

input{
width:100%;
padding:14px;
margin:7px 0;
border-radius:9px;
border:1px solid #555;
background:#333;
color:white;
font-size:15px;
}

button{
font-size:15px;
}

.principal{
width:100%;
padding:14px;
border:0;
border-radius:9px;
background:white;
color:black;
margin-top:10px;
}

.secundario{
width:100%;
padding:14px;
border:1px solid #555;
border-radius:9px;
background:#333;
color:white;
margin-top:10px;
}

.link{
background:none;
border:0;
color:#aaa;
margin-top:15px;
}


/* APP */

#app{
height:100vh;
display:flex;
}

.sidebar{
width:270px;
background:#171717;
padding:15px;
display:flex;
flex-direction:column;
}

.titulo{
font-size:22px;
margin-bottom:20px;
}

.nuevo{
padding:12px;
background:#333;
border:1px solid #555;
border-radius:9px;
color:white;
text-align:left;
}

.historialTitulo{
font-size:13px;
color:#777;
margin:18px 0 8px;
}

#historial{
flex:1;
overflow-y:auto;
}

.chatItem{
padding:11px;
border-radius:8px;
margin-bottom:4px;
color:#ccc;
cursor:pointer;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}

.chatItem:hover{
background:#2f2f2f;
}

.ajustes{
padding:12px;
background:#333;
border:1px solid #555;
border-radius:9px;
color:white;
text-align:left;
}


/* CHAT */

.principalArea{
flex:1;
display:flex;
flex-direction:column;
min-width:0;
}

.cabecera{
padding:18px;
border-bottom:1px solid #333;
}

#chat{
flex:1;
overflow-y:auto;
padding:30px 15%;
}

.bienvenida{
text-align:center;
margin-top:15%;
}

.kiwi{
font-size:70px;
}

.mensaje{
margin-bottom:25px;
line-height:1.6;
white-space:pre-wrap;
}

.usuario{
text-align:right;
}

.kiwiMensaje{
text-align:left;
}


/* ENTRADA */

.entrada{
padding:15px 15%;
}

.cajaMensaje{
display:flex;
background:#333;
border:1px solid #555;
border-radius:14px;
padding:6px;
}

textarea{
flex:1;
resize:none;
background:transparent;
border:0;
outline:0;
color:white;
padding:12px;
font-family:Arial;
font-size:15px;
min-height:45px;
}

.micro{
width:45px;
height:45px;
border:0;
border-radius:9px;
background:#444;
color:white;
}

.enviar{
width:45px;
height:45px;
border:0;
border-radius:9px;
background:white;
color:black;
margin-left:5px;
}


/* MODAL */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
display:flex;
align-items:center;
justify-content:center;
z-index:1000;
}

.modalCaja{
width:420px;
max-width:90%;
background:#252525;
border:1px solid #555;
border-radius:16px;
padding:25px;
}

.avatar{
width:90px;
height:90px;
border-radius:50%;
background:#333;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
margin:10px auto 20px;
overflow:hidden;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.info{
background:#333;
padding:12px;
border-radius:8px;
margin:8px 0;
color:#bbb;
word-break:break-all;
}

.peligro{
background:#8b0000;
color:white;
border:0;
width:100%;
padding:13px;
border-radius:8px;
margin-top:10px;
}

.cerrar{
background:#333;
color:white;
border:1px solid #555;
width:100%;
padding:13px;
border-radius:8px;
margin-top:10px;
}

@media(max-width:700px){

.sidebar{
display:none;
}

#chat{
padding:20px;
}

.entrada{
padding:10px;
}

}

</style>

</head>

<body>


<!-- LOGIN -->

<div id="login" class="pantalla">

<div class="caja">

<div class="logo">🦜</div>

<h1>Kiwi AI</h1>

<p>Inicia sesión para continuar</p>

<input
id="loginEmail"
type="email"
placeholder="Correo electrónico">

<input
id="loginPassword"
type="password"
placeholder="Contraseña">

<button
class="principal"
onclick="login()">

Iniciar sesión

</button>

<button
class="secundario"
onclick="mostrarRegistro()">

Crear una cuenta

</button>

<button
class="link"
onclick="mostrarRecuperacion()">

¿Has olvidado tu contraseña?

</button>

<div id="loginMensaje"></div>

</div>

</div>


<!-- REGISTRO -->

<div id="registro" class="pantalla oculto">

<div class="caja">

<div class="logo">🦜</div>

<h1>Crear cuenta</h1>

<input
id="registroNombre"
type="text"
placeholder="Tu nombre">

<input
id="registroEmail"
type="email"
placeholder="Correo electrónico">

<input
id="registroPassword"
type="password"
placeholder="Contraseña">

<input
id="registroPassword2"
type="password"
placeholder="Repite la contraseña">

<button
class="principal"
onclick="registrar()">

Crear cuenta

</button>

<button
class="link"
onclick="mostrarLogin()">

Ya tengo una cuenta

</button>

<div id="registroMensaje"></div>

</div>

</div>


<!-- RECUPERACION -->

<div id="recuperacion" class="pantalla oculto">

<div class="caja">

<div class="logo">🔑</div>

<h1>Recuperar contraseña</h1>

<input
id="recuperarEmail"
type="email"
placeholder="Correo electrónico">

<button
class="principal"
onclick="generarCodigo()">

Generar código

</button>

<div id="zonaCodigo" class="oculto">

<p>Tu código:</p>

<h2 id="codigo"></h2>

<input
id="codigoInput"
placeholder="Código">

<input
id="nuevaPassword"
type="password"
placeholder="Nueva contraseña">

<button
class="principal"
onclick="cambiarPassword()">

Cambiar contraseña

</button>

</div>

<button
class="link"
onclick="mostrarLogin()">

Volver

</button>

<div id="recuperacionMensaje"></div>

</div>

</div>


<!-- APP -->

<div id="app" class="oculto">


<div class="sidebar">

<div class="titulo">
🦜 Kiwi AI
</div>

<button
class="nuevo"
onclick="nuevoChat()">

＋ Nuevo chat

</button>

<div class="historialTitulo">
Chats
</div>

<div id="historial"></div>

<button
class="ajustes"
onclick="abrirPerfil()">

⚙️ Ajustes / Perfil

</button>

</div>


<div class="principalArea">

<div class="cabecera">
🦜 Kiwi AI
</div>

<div id="chat">

<div class="bienvenida">

<div class="kiwi">
🦜
</div>

<h1>
¿En qué puedo ayudarte?
</h1>

<p>
Habla con Kiwi AI
</p>

</div>

</div>


<div class="entrada">

<div class="cajaMensaje">

<textarea
id="texto"
placeholder="Escribe un mensaje a Kiwi..."
rows="1"></textarea>

<button
class="micro"
onclick="microfono()">

🎤

</button>

<button
class="enviar"
onclick="enviar()">

➤

</button>

</div>

</div>

</div>

</div>


<!-- PERFIL -->

<div
id="perfilModal"
class="modal oculto">

<div class="modalCaja">

<h2>👤 Perfil</h2>

<div
id="avatar"
class="avatar">

🦜

</div>

<input
id="avatarInput"
type="file"
accept="image/*"
onchange="cambiarAvatar(event)">

<input
id="perfilNombre"
placeholder="Nombre">

<div
id="perfilCorreo"
class="info">
</div>

<div
id="perfilFecha"
class="info">
</div>

<button
class="principal"
onclick="guardarPerfil()">

💾 Guardar cambios

</button>

<button
class="cerrar"
onclick="cerrarPerfil()">

🚪 Cerrar sesión

</button>

<button
class="peligro"
onclick="eliminarCuenta()">

🗑️ Eliminar cuenta

</button>

<button
class="cerrar"
onclick="cerrarPerfilModal()">

Cerrar

</button>

<div id="perfilMensaje"></div>

</div>

</div>


<script>


let usuario = null;

let chats = [];

let chatActual = null;

let avatarBase64 = "";


/* =========================
   PANTALLAS
========================= */

function ocultarPantallas(){

document
.getElementById("login")
.classList.add("oculto");

document
.getElementById("registro")
.classList.add("oculto");

document
.getElementById("recuperacion")
.classList.add("oculto");

}


function mostrarLogin(){

ocultarPantallas();

document
.getElementById("login")
.classList.remove("oculto");

}


function mostrarRegistro(){

ocultarPantallas();

document
.getElementById("registro")
.classList.remove("oculto");

}


function mostrarRecuperacion(){

ocultarPantallas();

document
.getElementById("recuperacion")
.classList.remove("oculto");

}


/* =========================
   REGISTRO
========================= */

async function registrar(){

const nombre =
document.getElementById(
"registroNombre"
).value.trim();

const email =
document.getElementById(
"registroEmail"
).value.trim();

const password =
document.getElementById(
"registroPassword"
).value;

const password2 =
document.getElementById(
"registroPassword2"
).value;


if(!nombre || !email || !password){

document.getElementById(
"registroMensaje"
).textContent =
"Completa todos los campos.";

return;

}

if(password !== password2){

document.getElementById(
"registroMensaje"
).textContent =
"Las contraseñas no coinciden.";

return;

}


const respuesta =
await fetch(
"/registro",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
nombre:nombre,
email:email,
password:password
})
});


const datos =
await respuesta.json();


if(datos.ok){

alert(
"Cuenta creada correctamente."
);

mostrarLogin();

}else{

document.getElementById(
"registroMensaje"
).textContent =
datos.mensaje;

}

}


/* =========================
   LOGIN
========================= */

async function login(){

const email =
document.getElementById(
"loginEmail"
).value.trim();

const password =
document.getElementById(
"loginPassword"
).value;


const respuesta =
await fetch(
"/login",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
email:email,
password:password
})
});


const datos =
await respuesta.json();


if(!datos.ok){

document.getElementById(
"loginMensaje"
).textContent =
datos.mensaje;

return;

}


usuario =
datos.usuario;


localStorage.setItem(
"kiwi_usuario",
JSON.stringify(usuario)
);


entrar();


}


/* =========================
   ENTRAR
========================= */

function entrar(){

ocultarPantallas();

document
.getElementById("app")
.classList.remove("oculto");

cargarChats();

}


/* =========================
   PERFIL
========================= */

async function abrirPerfil(){

if(!usuario){

return;

}


const respuesta =
await fetch(
"/perfil",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
email:usuario.email
})
});


const datos =
await respuesta.json();


if(datos.ok){

usuario =
datos.usuario;

document.getElementById(
"perfilNombre"
).value =
usuario.nombre;

document.getElementById(
"perfilCorreo"
).textContent =
"📧 " + usuario.email;

document.getElementById(
"perfilFecha"
).textContent =
"📅 Miembro desde " +
usuario.fecha_registro;


avatarBase64 =
usuario.avatar || "";


mostrarAvatar();

document
.getElementById("perfilModal")
.classList.remove(
"oculto"
);

}

}


function mostrarAvatar(){

const zona =
document.getElementById(
"avatar"
);


if(avatarBase64){

zona.innerHTML =
`<img src="${avatarBase64}">`;

}else{

zona.textContent =
"🦜";

}

}


function cambiarAvatar(event){

const archivo =
event.target.files[0];

if(!archivo){

return;

}


const lector =
new FileReader();


lector.onload =
function(){

avatarBase64 =
lector.result;

mostrarAvatar();

};


lector.readAsDataURL(
archivo
);

}


async function guardarPerfil(){

const nombre =
document.getElementById(
"perfilNombre"
).value.trim();


if(!nombre){

alert(
"Escribe un nombre."
);

return;

}


const respuesta =
await fetch(
"/actualizar_perfil",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({

email:usuario.email,

nombre:nombre,

avatar:avatarBase64

})
});


const datos =
await respuesta.json();


if(datos.ok){

usuario.nombre =
nombre;

usuario.avatar =
avatarBase64;

localStorage.setItem(
"kiwi_usuario",
JSON.stringify(usuario)
);

document.getElementById(
"perfilMensaje"
).textContent =
"Perfil guardado correctamente.";

}else{

document.getElementById(
"perfilMensaje"
).textContent =
datos.mensaje;

}

}


function cerrarPerfilModal(){

document
.getElementById("perfilModal")
.classList.add(
"oculto"
);

}


function cerrarPerfil(){

localStorage.removeItem(
"kiwi_usuario"
);

usuario = null;

chats = [];

chatActual = null;

cerrarPerfilModal();

mostrarLogin();

}


async function eliminarCuenta(){

if(!usuario){

return;

}


const confirmar =
confirm(
"¿Seguro que quieres eliminar tu cuenta?\n\nEsta acción no se puede deshacer."
);


if(!confirmar){

return;

}


const respuesta =
await fetch(
"/eliminar_cuenta",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
email:usuario.email
})
});


const datos =
await respuesta.json();


if(datos.ok){

localStorage.removeItem(
"kiwi_usuario"
);

localStorage.removeItem(
"kiwi_chats_" +
usuario.email
);

usuario = null;

chats = [];

chatActual = null;

alert(
"Cuenta eliminada correctamente."
);

location.reload();

}else{

alert(
"No se pudo eliminar la cuenta."
);

}

}


/* =========================
   RECUPERACION
========================= */

async function generarCodigo(){

const email =
document.getElementById(
"recuperarEmail"
).value.trim();


const respuesta =
await fetch(
"/generar_codigo",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
email:email
})
});


const datos =
await respuesta.json();


if(!datos.ok){

document.getElementById(
"recuperacionMensaje"
).textContent =
datos.mensaje;

return;

}


document.getElementById(
"codigo"
).textContent =
datos.codigo;


document.getElementById(
"zonaCodigo"
).classList.remove(
"oculto"
);

}


async function cambiarPassword(){

const email =
document.getElementById(
"recuperarEmail"
).value.trim();

const codigo =
document.getElementById(
"codigoInput"
).value.trim();

const password =
document.getElementById(
"nuevaPassword"
).value;


const respuesta =
await fetch(
"/cambiar_password",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({

email:email,

codigo:codigo,

password:password

})
});


const datos =
await respuesta.json();


if(datos.ok){

alert(
"Contraseña cambiada correctamente."
);

mostrarLogin();

}else{

document.getElementById(
"recuperacionMensaje"
).textContent =
datos.mensaje;

}

}


/* =========================
   CHATS
========================= */

function claveChats(){

return "kiwi_chats_" +
usuario.email;

}


function guardarChats(){

localStorage.setItem(
claveChats(),
JSON.stringify(chats)
);

}


function cargarChats(){

const guardados =
localStorage.getItem(
claveChats()
);


if(guardados){

try{

chats =
JSON.parse(
guardados
);

}catch{

chats = [];

}

}


if(!chats.length){

nuevoChat();

}else{

abrirChat(
chats[0].id
);

}

}


function nuevoChat(){

const nuevo = {

id:Date.now(),

titulo:"Nuevo chat",

mensajes:[]

};


chats.unshift(
nuevo
);

chatActual =
nuevo.id;

guardarChats();

mostrarHistorial();

mostrarChat();

}


function mostrarHistorial(){

const zona =
document.getElementById(
"historial"
);

zona.innerHTML = "";


chats.forEach(
chat=>{

const item =
document.createElement(
"div"
);

item.className =
"chatItem";

item.textContent =
chat.titulo;

item.onclick =
()=>abrirChat(
chat.id
);

zona.appendChild(
item
);

}
);

}


function abrirChat(id){

chatActual =
id;

mostrarHistorial();

mostrarChat();

}


function mostrarChat(){

const zona =
document.getElementById(
"chat"
);

zona.innerHTML = "";


const chat =
chats.find(
c=>c.id===chatActual
);


if(!chat){

return;

}


if(!chat.mensajes.length){

zona.innerHTML = `

<div class="bienvenida">

<div class="kiwi">
🦜
</div>

<h1>
¿En qué puedo ayudarte?
</h1>

<p>
Habla con Kiwi AI
</p>

</div>

`;

return;

}


chat.mensajes.forEach(
m=>mostrarMensaje(
m.texto,
m.tipo
)
);

}


function mostrarMensaje(
texto,
tipo
){

const zona =
document.getElementById(
"chat"
);

const div =
document.createElement(
"div"
);

div.className =
"mensaje " +
(
tipo === "usuario"
? "usuario"
: "kiwiMensaje"
);

div.textContent =
(
tipo === "usuario"
? "👤 "
: "🦜 "
) + texto;

zona.appendChild(
div
);

zona.scrollTop =
zona.scrollHeight;

}


/* =========================
   ENVIAR
========================= */

async function enviar(){

const caja =
document.getElementById(
"texto"
);

const texto =
caja.value.trim();


if(!texto){

return;

}


const chat =
chats.find(
c=>c.id===chatActual
);


if(!chat){

return;

}


chat.mensajes.push({

tipo:"usuario",

texto:texto

});


if(chat.titulo==="Nuevo chat"){

chat.titulo =
texto.substring(
0,
30
);

}


guardarChats();

mostrarHistorial();

mostrarMensaje(
texto,
"usuario"
);

caja.value = "";


const esperando =
mostrarMensaje(
"Kiwi está pensando...",
"kiwi"
);


try{

const respuesta =
await fetch(
"/chat",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({

mensaje:texto,

email:usuario.email

})
});


const datos =
await respuesta.json();


esperando.remove();


chat.mensajes.push({

tipo:"kiwi",

texto:datos.respuesta

});


guardarChats();

mostrarMensaje(
datos.respuesta,
"kiwi"
);


}catch{

esperando.remove();

mostrarMensaje(
"Kiwi no puede conectarse con Ollama.",
"kiwi"
);

}

}


/* =========================
   ENTER
========================= */

document
.getElementById("texto")
.addEventListener(
"keydown",
function(e){

if(
e.key==="Enter" &&
!e.shiftKey
){

e.preventDefault();

enviar();

}

}
);


/* =========================
   MICROFONO
========================= */

function microfono(){

const Reconocimiento =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(!Reconocimiento){

alert(
"Tu navegador no admite reconocimiento de voz."
);

return;

}


const reconocimiento =
new Reconocimiento();


reconocimiento.lang =
"es-ES";

reconocimiento.interimResults =
false;

reconocimiento.continuous =
false;


reconocimiento.onresult =
function(event){

document.getElementById(
"texto"
).value =
event.results[0][0]
.transcript;

};


reconocimiento.start();

}


/* =========================
   SESION GUARDADA
========================= */

try{

const guardado =
localStorage.getItem(
"kiwi_usuario"
);

if(guardado){

usuario =
JSON.parse(
guardado
);

entrar();

}

}catch{

localStorage.removeItem(
"kiwi_usuario"
);

}

</script>

</body>

</html>
